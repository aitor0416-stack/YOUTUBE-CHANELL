schema_version: "1.1"
name: tiktok-desde-espana
expected_outcome: |
  Dice con claridad que desde España TikTok no paga por visitas (Creator Rewards solo en EE. UU., UK, Alemania, Japón, Corea, Francia, México y Brasil) y que pide vídeos de 1 minuto o más y 100 % originales, así que los Shorts de 20 s no cobrarían; recomienda subirlo igualmente para crecer y monetizar por YouTube, con los requisitos del Programa de Socios.
